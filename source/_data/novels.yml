# ============================================================
#  小说下载区 —— 加小说只改这个文件
# ------------------------------------------------------------
#  四步走：
#    1. 把小说做成 zip 压缩包，放进  source/files/
#       （一本 3~4 卷？就每卷打一个 zip，下面 files 里写几条即可）
#    2. 给这本小说定一个密码，用 工具/算密码.py 算出哈希
#       （命令：python 工具/算密码.py 你的密码）
#    3. 在下面 novels: 里照抄一条，填书名、简介、文件路径、password_hash
#    4. 双击「一键发布.bat」上线
#
#  ★ 文件名不要用下划线开头（如 _xxx.zip），Hexo 会忽略它、不会发布。
#  ★ 文件名建议英文或拼音，例如「达哈伦的修女-第1卷.zip」→ dhldxn-vol1.zip
#
#  密码说明（每本小说一个，各不相同）：
#    - password_hash 存的是密码的「哈希」，不可逆，密码本身不会出现在网站源码里；
#    - 生成哈希：python 工具/算密码.py 你的密码
#      把打印出的那串填到下面这本的 password_hash。
#    - 访客在页面上输入密码，浏览器本地算哈希来比对，正确才展开下载按钮。
#    - 强烈建议：打包 zip 时也给 zip 加一个「压缩密码」，密码就设成和这本小说的
#      下载密码一样 —— 这样就算文件被直接下载，没密码也解不开（真正的保护）。
#
#  安全提示：纯静态网站没有服务器，页面密码只是「门帘」级别 —— 能挡住普通访客，
#  但懂技术的人若知道文件地址仍可直接下载。要更强的保护就靠 zip 自带的压缩密码。
# ============================================================

novels:
  # ---- 照抄下面这段改内容即可 ----
  # - title: 小说书名
  #   original: 原名（可选，日文/韩文原名）
  #   author: 原作者（可选）
  #   cover: /img/cover/xxx.jpg        # 可选，不写就按书名自动生成渐变封面
  #   status: 已完结                    # 可选，随便写，只是个标签
  #   intro: |
  #     两三句简介，想写几行写几行。
  #   password_hash: "用算密码.py 算出来的那串哈希"   # ★ 每本一个，各不相同
  #   files:
  #     - name: 第1卷（EPUB）
  #       path: /files/xxx-vol1.zip
  #       size: 12.3 MB                  # 可选
  #     - name: 第2卷（EPUB）
  #       path: /files/xxx-vol2.zip
  #       size: 11.8 MB
