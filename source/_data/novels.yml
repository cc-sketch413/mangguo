# ============================================================
#  小说下载区 —— 加小说只改这个文件
# ------------------------------------------------------------
#  三步走：
#    1. 把 TXT / EPUB 文件放进  source/files/  （文件名建议用英文或拼音）
#    2. 在下面 novels: 里照抄一条，填书名、简介、文件路径
#    3. 双击「一键发布.bat」上线
#
#  ★ 文件名不要用下划线开头（如 _xxx.txt），Hexo 会忽略它、不会发布。
#
#  下载密码（全站统一一个）：
#    - 这里存的是密码的「哈希」，不可逆，所以密码本身不会出现在网站源码里；
#    - 改密码：命令行跑一次
#        python -c "import hashlib;print(hashlib.sha256('你的新密码'.encode()).hexdigest())"
#      把打印出来的那串覆盖到下面的 password_hash 即可。
#    - 访客在页面上输入密码，浏览器本地算哈希来比对，正确才展开下载按钮。
#
#  安全提示：纯静态网站没有服务器，这只是「门帘」级别 —— 能挡住普通访客，
#  但懂技术的人若知道文件地址仍可直接下载。要更强的保护需改为文件加密方案。
# ============================================================

