# ============================================================
#  小说下载区 —— 加小说只改这个文件
# ------------------------------------------------------------
#  三步走：
#    1. 把小说文件（zip 或 epub 都行）放进  source/files/
#       （一本多卷？每卷一个文件，下面 files 里写几条即可）
#    2. 在下面 novels: 里照抄一条，填书名、简介、文件路径、
#       password（你自己设置的下载密码，直接写明文就行）
#    3. 双击「一键发布.bat」上线
#
#  ★ 文件名不要用下划线开头（如 _xxx.zip），Hexo 会忽略它、不会发布。
#  ★ 文件名建议英文或拼音，例如「达哈伦的修女第1卷.zip」→ dhldxn-vol1.zip
#
#  密码说明（每本小说一个，各不相同，由你自己随便设）：
#    - 直接写  password: 你的密码   就行，不用跑任何脚本！
#      访客在小说页输入这个密码，才能看到并下载文件。
#    - 密码建议只用英文和数字（比如 mangguo123），别带空格、别带引号。
#    - 内部会把这个密码转成「哈希」再进网页，所以你的密码明文
#      不会出现在网站页面源码里。（novels.yml 本身是公开的，
#      如果有人能看到你的仓库，也能看到这里的明文密码 ——
#      介意的话可以把这本改回 password_hash 写法，见最下面注释。）
#
#  安全提示：纯静态网站没有服务器，页面密码只是「门帘」级别 —— 能挡住普通访客，
#  但懂技术的人若知道文件地址仍可直接下载。要更强的保护，就把 zip 本身也加
#  「压缩密码」，压缩密码设成和这本的下载密码一样。
# ============================================================

novels:

  # ============================================================
  #  第 1 本：培育室里的雄性
  #  ★★★ 把下面 password: 后面的文字，改成你自己设置的下载密码 ★★★
  #       改完保存，双击「一键发布.bat」就生效。
  # ============================================================
  - title: 培育室里的雄性
    original: 사육실의 수컷들
    author: 세라비이
    cover: /img/cover/pysldxxxs.jpg       # 可选，不写就按书名自动生成渐变封面
    status: 已完结                         # 可选，随便写，只是个标签
    intro: |
      这里写两三句简介，想写几行写几行。
    password: lishixia                    # ★ 下载密码：访客输入这个才能下载
    files:
      - name: 第1卷
        path: /files/pysldxx/sayugsilyi sukeosdeul 1 - serabii.epub
        size: 1.61 MB                       # 可选
      - name: 第2卷
        path: /files/pysldxx/sayugsilyi sukeosdeul 2 - serabii.epub
        size: 1.60 MB
      - name: 第3卷
        path: /files/pysldxx/sayugsilyi sukeosdeul 3 - serabii.epub
        size: 1.61 MB


# ------------------------------------------------------------
#  加第二本？把下面这个「空白模板」整段复制到上面（缩进对齐），改掉内容即可。
#   ① 每行开头必须是「两个空格 + - title:」这种缩进
#   ② 冒号后面要留一个空格（password: 我的密码）
#   ③ 每本的 password 要不一样
#   ④ path 必须以 /files/ 开头（正斜杠）
# ------------------------------------------------------------
#
#  - title: 书名
#    original: 原文名
#    author: 原作者
#    cover: /img/cover/封面文件名.jpg
#    status: 已完结
#    intro: |
#      这里写两三句简介。
#    password: 这本的下载密码
#    files:
#      - name: 第1卷
#        path: /files/子文件夹/文件名1.zip
#        size: 1.5 MB
#      - name: 第2卷
#        path: /files/子文件夹/文件名2.zip
#        size: 1.6 MB
#
#  进阶（可忽略）：若不想让密码明文出现在本文件里，
#  把 password: 那行换成：
#      password_hash: "用 工具/算密码.py 算出来的那串"
#  命令：python 工具/算密码.py 你的密码  （会打印出一串哈希）
# ------------------------------------------------------------
