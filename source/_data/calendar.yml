# ============================================================
#  日历数据
#  ------------------------------------------------------------
#  这个文件就是日历的「数据源」，改这里 = 改日历内容。
#  改完保存 → 双击「一键发布.bat」→ 1~2 分钟后线上生效。
#
#  【new_works】新作日历：RIDIBOOK / Lezhin 的每月新作
#  【updates】  汉化更新日历：本站汉化作品的更新
#
#  字段说明
#    date      必填，格式 YYYY-MM-DD（★ 一定要用引号包起来）
#    title     必填，作品名
#    platform  新作用：RIDIBOOK / Lezhin
#    episode   更新用：更新到第几话，如「外传5」
#    cover     封面图，如 /img/calendar/xxx.jpg；留空自动生成渐变封面
#    link      点弹层里的「去看看」按钮跳这里（官网链接或本站作品页）
#
#  写法示例（下面这段是注释，不会显示在页面上；要加条目就照这个格式写）
#    new_works:
#      - date: "2026-10-05"
#        platform: Lezhin
#        title: 作品名
#        cover:
#        link:
# ============================================================

# 新作日历：RIDIBOOK / Lezhin 每月新作
# 没有条目时页面会显示「本月暂无记录」，不影响使用。
new_works:

