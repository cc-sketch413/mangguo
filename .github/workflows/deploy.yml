name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 完整历史：下一步要按「文件最后提交时间」恢复 mtime

      - name: 恢复文件修改时间
        run: |
          # ★ Git 不保留文件的修改时间(mtime)，checkout 后所有文件都变成「刚刚」，
          #   而站点用 updated_option: mtime 决定「最近更新」排序 —— 不修就全乱。
          #   这里把每个文件的 mtime 还原成它最后一次提交的时间。
          for f in $(git ls-files 'source/_posts/*.md'); do
            ts=$(git log -1 --format=%ct -- "$f")
            if [ -n "$ts" ]; then touch -d "@$ts" "$f"; fi
          done
          echo "--- 恢复后的作品修改时间 ---"
          ls -la --time-style=+%Y-%m-%d_%H:%M source/_posts/

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci || npm install

      - name: 适配 GitHub Pages 子路径
        run: |
          sed -i 's|^url:.*|url: https://cc-sketch413.github.io|' _config.yml
          sed -i 's|^root:.*|root: /mangguo/|' _config.yml
          echo "--- 构建配置 ---"
          grep -E '^(url|root):' _config.yml

      - name: 构建站点
        run: npm run build

      - name: 修补漏网的绝对路径（inject、菜单、正文链接）
        run: python 工具/适配子路径.py

      - name: 抽查修补结果
        run: |
          echo "--- 应该带 /mangguo/ 前缀的路径 ---"
          grep -oE '(href|src)="/mangguo/(css|js)/[^"]*"' public/index.html | head -5
          echo "--- 不应该再出现裸的根路径引用 ---"
          if grep -qE '(href|src)="/(css|js|img|guide|library)/' public/index.html; then
            echo "!! 仍有漏网路径"; grep -oE '(href|src)="/[^"]*"' public/index.html | head -10; exit 1
          else
            echo "OK 未发现漏网路径"
          fi

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
